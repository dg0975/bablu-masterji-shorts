<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/
:root{
  --bg:#06080f; --ink:#ffffff; --dim:#aab3c5; --mute:#6b7488; --line:rgba(255,255,255,.10);
  --cyan:#35d6ed; --pink:#ff5c8a; --amber:#ffb020; --green:#43e08c; --violet:#a78bfa; --red:#ff5a5a; --white:#ffffff;
  --accent:var(--cyan);
  --sans:"Poppins","Noto Sans Devanagari","Noto Color Emoji",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 50% 12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
  radial-gradient(700px 500px at 50% 82%, rgba(255,255,255,.045), transparent 70%), var(--bg)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.5px, transparent 1.5px);background-size:54px 54px;
  mask-image:linear-gradient(#000 0%,transparent 55%)}
#aurora,#motes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#aurora i{position:absolute;left:0;top:0;width:1200px;height:1200px;border-radius:50%;will-change:transform}
#motes i{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1250px 1650px at 50% 42%, transparent 58%, rgba(0,0,0,.6) 100%)}
#sweep{position:absolute;top:-300px;left:0;width:700px;height:2520px;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13) 50%,transparent);will-change:transform}
.cam{position:absolute;inset:0;transform-origin:50% 55%;will-change:transform}
#handle{position:absolute;top:84px;right:60px;font:600 26px var(--mono);color:var(--dim);letter-spacing:.5px}
#prog{position:absolute;top:134px;left:60px;width:960px;display:flex;gap:10px}
#prog .seg{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;border-radius:4px}

.scene{position:absolute;inset:0;display:none}
.head{position:absolute;top:186px;left:60px;width:960px;text-align:center}
.kicker{font:700 27px var(--mono);letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.headline{font-weight:700;font-size:78px;line-height:1.16;letter-spacing:-1px}
.headline .hl{color:var(--accent);text-shadow:0 0 34px color-mix(in srgb, var(--accent) 55%, transparent)}
.sub{margin:20px auto 0;max-width:900px;font-weight:500;font-size:35px;line-height:1.38;color:#d5dbe8}
.visual{position:absolute;top:600px;left:60px;width:960px;height:530px}
.visual.panel{background:rgba(255,255,255,.028);border:2px solid var(--line);border-radius:36px;overflow:hidden}
.visual svg{width:100%;height:100%;display:block}
.vtag{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.visual.hastag .c-fill{bottom:50px}
.vtag span{display:inline-block;font:600 21px var(--mono);color:var(--mute);border:2px solid var(--line);border-radius:10px;padding:5px 14px;background:rgba(255,255,255,.03)}

/* ---------- built-in components ---------- */
.c-fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cards{gap:20px;align-items:stretch;padding:40px 0}
.card{flex:1;max-width:300px;border:2.5px solid var(--line);border-radius:30px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 12px;text-align:center}
.card .ic{font-size:104px;line-height:1.1}
.card .lb{font:700 23px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.card .vl{font-weight:700;font-size:42px;line-height:1.15;color:var(--c,var(--ink))}
.card.on{border-color:var(--c);box-shadow:0 0 44px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 0 1px var(--c)}
.bars{gap:34px;align-items:flex-end;padding:20px 30px 0}
.bar{flex:1;max-width:230px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar .num{font-weight:700;font-size:50px;color:var(--c);margin-bottom:10px;white-space:nowrap}
.bar .col{width:100%;border-radius:22px 22px 8px 8px;background:linear-gradient(var(--c), color-mix(in srgb, var(--c) 55%, #000));box-shadow:0 0 50px color-mix(in srgb, var(--c) 35%, transparent)}
.bar .lb{margin-top:14px;height:74px;font-weight:600;font-size:28px;line-height:1.2;color:#d5dbe8;text-align:center}
.list{flex-direction:column;gap:18px;justify-content:center;padding:0 10px}
.row{width:100%;display:flex;align-items:center;gap:22px;border:2.5px solid color-mix(in srgb, var(--c) 55%, transparent);background:color-mix(in srgb, var(--c) 9%, transparent);border-radius:24px;padding:20px 26px}
.row .n{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font:700 30px var(--mono);color:var(--c);border:2.5px solid var(--c)}
.row .tt{font-weight:700;font-size:40px;line-height:1.2}
.row .nt{font-weight:500;font-size:28px;color:var(--c);margin-top:4px;line-height:1.25}
.number{flex-direction:column;gap:6px}
.number .big{font-weight:700;font-size:210px;line-height:1.05;color:var(--c);text-shadow:0 0 70px color-mix(in srgb, var(--c) 50%, transparent);letter-spacing:-4px;white-space:nowrap}
.number .lb{font-weight:600;font-size:40px;color:#d5dbe8;text-align:center;max-width:860px;line-height:1.3}
.compare{gap:26px;align-items:stretch;padding:14px 0}
.side{flex:1;border:2.5px solid color-mix(in srgb, var(--c) 60%, transparent);background:color-mix(in srgb, var(--c) 8%, transparent);border-radius:32px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.side .ic{font-size:96px;line-height:1.1}
.side .tt{font-weight:700;font-size:40px;color:var(--c);line-height:1.2}
.side .ln{font-weight:500;font-size:30px;color:#dfe4ee;line-height:1.3}
.vs{align-self:center;font:700 30px var(--mono);color:var(--mute)}
/* helpers usable inside custom svg/html */
.lbl{font:700 24px var(--mono);letter-spacing:1.5px;fill:var(--dim);color:var(--dim)}
.t-big{font:700 54px var(--sans);fill:#fff}
.t-mid{font:600 34px var(--sans);fill:#fff}
.t-sm{font:500 26px var(--sans);fill:#d5dbe8}

#caption{position:absolute;top:1150px;left:70px;width:940px;height:110px;display:flex;align-items:center;justify-content:center;text-align:center}
#caption span{display:inline-block;font-weight:600;font-size:40px;line-height:1.3;color:#fff;background:rgba(10,13,22,.78);border:2px solid var(--line);border-radius:20px;padding:10px 26px;max-width:940px}

#cast{position:absolute;left:0;top:1270px;width:1080px;height:350px}
.mascot{position:absolute;bottom:0;width:300px;height:340px}
#m0{left:70px} #m1{right:70px}
.bubble{position:absolute;max-width:400px;font-weight:600;font-size:36px;line-height:1.22;color:#0b0e17;padding:16px 26px;border-radius:28px;transform-origin:0% 100%;opacity:0;white-space:normal}
#b0{left:356px;bottom:236px;background:#fff;border-bottom-left-radius:6px}
#b1{right:356px;bottom:92px;max-width:330px;background:var(--violet);border-bottom-right-radius:6px;transform-origin:100% 100%;text-align:right}
#b0.acc{background:var(--accent)}
.bubble{font-family:'Kalam',var(--sans);font-weight:700;font-size:40px;line-height:1.15}
#m0.mj{left:50px;width:330px;height:400px}
#m0.mj~#b0{left:392px}
#m0.mj svg{position:absolute;left:0;bottom:0;overflow:visible}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="aurora"><i></i><i></i><i></i></div><div id="dots"></div><div id="motes"></div><div id="vig"></div>
  <div id="handle"></div><div id="prog"></div>
  <div id="scenes"></div><div id="sweep"></div>
  <div id="caption"></div>
  <div id="cast">
    <div class="mascot" id="m0"></div><div class="bubble" id="b0"></div>
    <div class="mascot" id="m1"></div><div class="bubble" id="b1"></div>
  </div>
</div>
<script>
/*DATA*/
const COL={cyan:'#35d6ed',pink:'#ff5c8a',amber:'#ffb020',green:'#43e08c',violet:'#a78bfa',red:'#ff5a5a',white:'#ffffff'};
const col=c=>COL[c]||c||COL.cyan;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=p=>1-Math.pow(1-clamp(p),3);
const eBack=p=>{p=clamp(p);const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const eIO=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const lerp=(a,b,p)=>a+(b-a)*p;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const rich=s=>esc(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>').replace(/\n/g,'<br>');

/* ---------------- components -> DOM ---------------- */
function A(step,anim,delay){return `data-step="${step||0}" data-anim="${anim||'up'}"`+(delay?` data-delay="${delay}"`:'')}
function buildVisual(v){
  if(!v) return '';
  const tag=v.tag?`<div class="vtag" ${A(v.tagStep||0,'fade',.3)}><span>${esc(v.tag)}</span></div>`:'';
  const T=v.type;
  const inner=buildInner(v); return inner?`<div class="cam">${inner}</div>`+tag:'';
}
function buildInner(v){
  const T=v.type;
  if(T==='svg'||T==='html') return (v.svg||v.html||'');
  if(T==='3d') return `<canvas class="g3d" width="960" height="530" style="width:960px;height:530px;display:block"></canvas>`;
  if(T==='cards') return `<div class="c-fill cards">`+v.items.map((it,i)=>
    `<div class="card${it.on?' on':''}" style="--c:${col(it.color)}" ${A(it.step,'pop',it.step?0:i*.12)}${it.hide!=null?` data-hide="${it.hide}"`:''}${it.dim!=null?` data-dim="${it.dim}"`:''}>
      ${it.icon?`<div class="ic">${esc(it.icon)}</div>`:''}${it.label?`<div class="lb">${esc(it.label)}</div>`:''}${it.value?`<div class="vl">${esc(it.value)}</div>`:''}</div>`).join('')+`</div>`;
  if(T==='bars'){const mx=v.max||Math.max(...v.items.map(i=>i.value));
    return `<div class="c-fill bars">`+v.items.map((it,i)=>{const h=Math.max(4,Math.round(300*it.value/mx));const d=it.step?0:i*.15;
      return `<div class="bar" style="--c:${col(it.color)}"><div class="num" ${A(it.step,'fade',d)}><span data-step="${it.step||0}" data-delay="${d}" data-count="0,${it.value},${v.decimals||0}" data-prefix="${esc(v.prefix||'')}" data-suffix="${esc(v.unit||'')}"></span></div>
      <div class="col" style="height:${h}px" ${A(it.step,'grow',d)}></div><div class="lb" ${A(it.step,'fade',d)}>${esc(it.label)}</div></div>`}).join('')+`</div>`}
  if(T==='list') return `<div class="c-fill list">`+v.items.map((it,i)=>
    `<div class="row" style="--c:${col(it.color||['pink','amber','green','cyan'][i%4])}" ${A(it.step!=null?it.step:i,'up')}${it.dim!=null?` data-dim="${it.dim}"`:''}><div class="n">${esc(it.n||i+1)}</div><div><div class="tt">${esc(it.title)}</div>${it.note?`<div class="nt">${esc(it.note)}</div>`:''}</div></div>`).join('')+`</div>`;
  if(T==='number') return `<div class="c-fill number" style="--c:${col(v.color)}"><div class="big" ${A(v.step,'pop')}><span data-step="${v.step||0}" data-count="${v.from||0},${v.to},${v.decimals||0}" data-dur="${v.dur||1.4}" data-prefix="${esc(v.prefix||'')}" data-suffix="${esc(v.suffix||'')}"></span></div>${v.label?`<div class="lb" ${A(v.step,'up',.25)}>${esc(v.label)}</div>`:''}</div>`;
  if(T==='compare'){const side=(s,d)=>`<div class="side" style="--c:${col(s.color)}" ${A(s.step,'up',d)}>${s.icon?`<div class="ic">${esc(s.icon)}</div>`:''}<div class="tt">${esc(s.title)}</div>${(s.lines||[]).map(l=>`<div class="ln">${esc(l)}</div>`).join('')}</div>`;
    return `<div class="c-fill compare">${side(v.left,0)}${v.vs===false?'':`<div class="vs" ${A(v.right.step,'fade')}>VS</div>`}${side(v.right,v.right.step?0:.2)}</div>`}
  return '';
}

/* ---------------- mascot (drawn in code) ---------------- */
const POSES={ // sL,eL,sR,eR = shoulder/elbow angles left/right; tilt; eyes; mouth; lookx,looky
  idle :{sL:8,eL:6,sR:-8,eR:-6,tilt:0,eyes:'normal',mouth:'smile'},
  point:{sL:10,eL:8,sR:-146,eR:-10,tilt:-5,eyes:'normal',mouth:'smile',lx:5,ly:-6},
  think:{sL:12,eL:8,sR:-38,eR:-172,tilt:7,eyes:'normal',mouth:'flat',lx:7,ly:-9},
  shock:{sL:138,eL:26,sR:-138,eR:-26,tilt:0,eyes:'wide',mouth:'o'},
  happy:{sL:150,eL:10,sR:-150,eR:-10,tilt:0,eyes:'happy',mouth:'grin'},
  sad  :{sL:4,eL:2,sR:-4,eR:-2,tilt:8,eyes:'sad',mouth:'frown',ly:6},
  shrug:{sL:62,eL:74,sR:-62,eR:-74,tilt:-6,eyes:'normal',mouth:'flat'},
  wave :{sL:8,eL:6,sR:-150,eR:-20,tilt:-4,eyes:'happy',mouth:'grin'},
};
function mascotShell(id,pal){return `
<svg viewBox="0 0 300 340" width="300" height="340" xmlns="http://www.w3.org/2000/svg">
 <defs><radialGradient id="${id}g"><stop offset="0" stop-color="${pal.glow}" stop-opacity=".9"/><stop offset="1" stop-color="${pal.glow}" stop-opacity="0"/></radialGradient></defs>
 <ellipse id="${id}sh" cx="150" cy="328" rx="84" ry="10" fill="#000" opacity=".45"/>
 <g id="${id}all">
  <rect x="112" y="266" width="28" height="50" rx="12" fill="${pal.limb}"/><rect x="160" y="266" width="28" height="50" rx="12" fill="${pal.limb}"/>
  <ellipse cx="122" cy="318" rx="24" ry="12" fill="${pal.dark}"/><ellipse cx="178" cy="318" rx="24" ry="12" fill="${pal.dark}"/>
  <g id="${id}aL"><rect x="62" y="204" width="24" height="46" rx="12" fill="${pal.limb}"/><g id="${id}fL"><rect x="62" y="234" width="24" height="46" rx="12" fill="${pal.limb}"/><circle cx="74" cy="284" r="17" fill="${pal.body}" stroke="${pal.dark}" stroke-width="4"/></g></g>
  <g id="${id}aR"><rect x="214" y="204" width="24" height="46" rx="12" fill="${pal.limb}"/><g id="${id}fR"><rect x="214" y="234" width="24" height="46" rx="12" fill="${pal.limb}"/><circle cx="226" cy="284" r="17" fill="${pal.body}" stroke="${pal.dark}" stroke-width="4"/></g></g>
  <rect x="88" y="188" width="124" height="98" rx="30" fill="${pal.body}" stroke="${pal.dark}" stroke-width="5"/>
  <circle cx="150" cy="236" r="34" fill="url(#${id}g)" id="${id}cg"/><circle cx="150" cy="236" r="14" fill="${pal.glow}" stroke="${pal.dark}" stroke-width="4"/>
  <rect x="136" y="172" width="28" height="22" fill="${pal.dark}"/>
  <g id="${id}hd">
   <line x1="150" y1="54" x2="150" y2="24" stroke="${pal.dark}" stroke-width="7" stroke-linecap="round"/>
   <circle cx="150" cy="18" r="26" fill="url(#${id}g)" id="${id}bg"/><circle cx="150" cy="18" r="11" fill="${pal.glow}" stroke="${pal.dark}" stroke-width="4"/>
   <rect x="32" y="94" width="22" height="48" rx="10" fill="${pal.limb}"/><rect x="246" y="94" width="22" height="48" rx="10" fill="${pal.limb}"/>
   <rect x="48" y="50" width="204" height="134" rx="46" fill="${pal.body}" stroke="${pal.dark}" stroke-width="5"/>
   <path d="M74 66 Q110 56 150 56" stroke="#fff" stroke-opacity=".5" stroke-width="7" fill="none" stroke-linecap="round"/>
   <rect x="68" y="72" width="164" height="92" rx="32" fill="#0c1124" stroke="${pal.dark}" stroke-width="4"/>
   <g id="${id}face"></g>
  </g>
 </g>
</svg>`}
const PAL=[{body:'#ffc93c',dark:'#7a4b00',limb:'#8d96ab',glow:'#ff5c8a',eye:'#8ff4ff'},
           {body:'#a78bfa',dark:'#3b2a80',limb:'#8d96ab',glow:'#ffb020',eye:'#fff2b0'}];
function face(P,t,talk,seed,eye){
  const lx=P.lx||0, ly=P.ly||0, blink=((t+seed*1.3)%3.3)<0.13;
  let e='';
  for(const cx of [118+lx,182+lx]){const cy=112+ly;
    if(P.eyes==='happy') e+=`<path d="M${cx-15} ${cy+6} Q${cx} ${cy-16} ${cx+15} ${cy+6}" stroke="${eye}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    else if(P.eyes==='wide') e+=`<circle cx="${cx}" cy="${cy}" r="19" fill="none" stroke="${eye}" stroke-width="7"/><circle cx="${cx}" cy="${cy}" r="6" fill="${eye}"/>`;
    else if(P.eyes==='sad') e+=`<rect x="${cx-10}" y="${cy-12}" width="20" height="26" rx="10" fill="${eye}" transform="rotate(${cx<150?-18:18} ${cx} ${cy})"/>`;
    else e+=`<rect x="${cx-11}" y="${cy-(blink?2:17)}" width="22" height="${blink?4:34}" rx="${blink?2:11}" fill="${eye}"/>`;}
  const my=143+ly*.5, mx=150+lx*.6; let m;
  if(talk>0){const o=(Math.abs(Math.sin(t*19+seed))*.6+Math.abs(Math.sin(t*31+1))*.4)*talk; m=`<ellipse cx="${mx}" cy="${my}" rx="${11-o*2}" ry="${2+o*8}" fill="${eye}"/>`}
  else if(P.mouth==='o') m=`<circle cx="${mx}" cy="${my+1}" r="8" fill="none" stroke="${eye}" stroke-width="5"/>`;
  else if(P.mouth==='grin') m=`<path d="M${mx-16} ${my-4} Q${mx} ${my+16} ${mx+16} ${my-4} Z" fill="${eye}"/>`;
  else if(P.mouth==='frown') m=`<path d="M${mx-12} ${my+5} Q${mx} ${my-7} ${mx+12} ${my+5}" stroke="${eye}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  else if(P.mouth==='flat') m=`<path d="M${mx-10} ${my} H${mx+10}" stroke="${eye}" stroke-width="5" stroke-linecap="round"/>`;
  else m=`<path d="M${mx-12} ${my-3} Q${mx} ${my+9} ${mx+12} ${my-3}" stroke="${eye}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return e+m;
}
function drawMascot(i,Pa,Pb,p,t,talk,hop){
  const id='m'+i+'_', n=k=>lerp(Pa[k]||0,Pb[k]||0,p), P=p>.5?Pb:Pa;
  const wave=(P===POSES.wave||P===POSES.happy)?Math.sin(t*9+i)*14:0;
  const bob=Math.sin(t*2.3+i*2)*4 - hop*46;
  $('#'+id+'all').setAttribute('transform',`translate(0 ${bob.toFixed(2)})`);
  $('#'+id+'sh').setAttribute('rx',(84-hop*22).toFixed(1));
  $('#'+id+'aL').setAttribute('transform',`rotate(${n('sL').toFixed(1)} 74 214)`);
  $('#'+id+'fL').setAttribute('transform',`rotate(${(n('eL')+(P===POSES.happy?-wave:0)).toFixed(1)} 74 246)`);
  $('#'+id+'aR').setAttribute('transform',`rotate(${n('sR').toFixed(1)} 226 214)`);
  $('#'+id+'fR').setAttribute('transform',`rotate(${(n('eR')+wave).toFixed(1)} 226 246)`);
  $('#'+id+'hd').setAttribute('transform',`rotate(${(n('tilt')+Math.sin(t*1.7+i)*1.5).toFixed(2)} 150 184)`);
  const g=.55+.45*Math.sin(t*4+i); $('#'+id+'bg').setAttribute('opacity',g.toFixed(2)); $('#'+id+'cg').setAttribute('opacity',(1-g*.5).toFixed(2));
  const F={...P,lx:n('lx'),ly:n('ly')}; $('#'+id+'face').innerHTML=face(F,t,talk,i,PAL[i].eye);
}

/* ---------------- Bablu Masterji (main mascot, from the user's design) ---------------- */
// smooth motion helpers shared by Masterji and the skit cast
function handSvg(h,e,skin,side){const a=Math.atan2(h[1]-e[1],h[0]-e[0])*180/Math.PI-90, f=n=>n.toFixed(1), ol='#5a3424';
 const fing=[-7,0,7].map((x,k)=>`<rect x="${x-3.6}" y="4" width="7.2" height="${15-Math.abs(k-1)*2}" rx="3.6" fill="${skin}" stroke="${ol}" stroke-width="1.6"/>`).join('');
 return `<g transform="translate(${f(h[0])} ${f(h[1])}) rotate(${f(a)})">${fing}<ellipse cx="0" cy="0" rx="12.5" ry="11" fill="${skin}" stroke="${ol}" stroke-width="1.8"/>
  <rect x="${side>0?7:-15}" y="-6" width="8" height="15" rx="4" fill="${skin}" stroke="${ol}" stroke-width="1.6" transform="rotate(${side>0?-30:30} ${side>0?11:-11} -2)"/><ellipse cx="-3" cy="-3" rx="5" ry="3.5" fill="#fff" opacity=".22"/></g>`}
const sstep=x=>{x=Math.max(0,Math.min(1,x));return x*x*x*(x*(x*6-15)+10)};                     // smootherstep: soft start, soft stop

  let bi=0; for(let i=0;i<BE.length;i++) if(t>=BE[i]._t.start) bi=i;
  const b=BE[bi], bt=b._t, started=t>=bt.start, prev=BE[Math.max(0,bi-1)];
  const Pb=POSES[(started?b.pose:null)||'idle']||POSES.idle, Pa=POSES[(bi>0?prev.pose:'wave')||'idle']||POSES.idle;
  const pp=started?eIO((t-bt.start)/.35):1, speaking=started&&b.say&&t<bt.audioEnd?1:0;
  let hop=t<0.9?Math.sin(clamp(t/.6)*Math.PI)*.8:Math.max(0,Math.sin(clamp((t-T.start)/.45)*Math.PI))*.35;
  if(started&&bt!==T.beats[0]) hop+=.12*Math.max(0,Math.sin(clamp((t-bt.start)/.3)*Math.PI));
  let lv=null, lvs=null;
  if(TL.env&&speaking){const E=TL.env, f=Math.round(t*(TL.envFps||30)), g=k=>E[Math.max(0,Math.min(E.length-1,k))]||0;
    lv=Math.max(g(f),g(f+1)*.8); let a=0; for(let k=-6;k<=6;k++) a+=g(f+k); lvs=a/13;}
  if(SB.mascot==='robot') drawMascot(0,Pa,Pb,pp,t,speaking,hop);
  else $('#mjg').innerHTML=drawMasterji((bi>0?prev.pose:'wave')||'idle',(started?b.pose:null)||'idle',pp,t,speaking,hop,0,lv,lvs,speaking?visAt(t):null);
  const b0=$('#b0'), b1=$('#b1');
  const showB=(el,txt,t0,t1,acc)=>{ if(!txt||t<t0){el.style.opacity=0;return}
    if(el._txt!==txt){el._txt=txt; el.innerHTML=rich(txt)} const p=(t-t0)/.3; el.style.opacity=clamp(p*3)*clamp((t1-t)/.15); el.style.transform=`scale(${eBack(p)})`; };
  b0.classList.toggle('acc',!!b.bubbleAccent);
  showB(b0,started&&b.bubble,bt.start+.12,bt.end);
  // friend
  const fNow=s._friend, fPrev=si>0&&S[si-1]._friend; let fx=0;
  if(fNow) fx=fPrev?1:eOut(lt/.45); else fx=fPrev?1-eOut(lt/.35):0;
  $('#m1').style.opacity=fx>0?1:0; $('#m1').style.transform=`translateX(${(1-fx)*420}px)`;
  const ft0=bt.start+(b.bubble?(bt.end-bt.start)*.45:.12);
  const fTalk=started&&b.friend&&t>ft0&&t<ft0+.9?1:0;
  const fpose=started&&b.friend&&t>ft0?(b.friendPose||'idle'):'idle';
  drawMascot(1,POSES.idle,POSES[fpose]||POSES.idle,started&&b.friend?eIO((t-ft0)/.3):0,t,fTalk,0);
  showB(b1,started&&b.friend&&fx>=1?b.friend:null,ft0,bt.end);
  // caption
  const cap=$('#caption'); let ct='';
  if(SB.captions!==false&&started&&b.say&&t<bt.audioEnd+.15){const q=(t-bt.start)/(bt.audioEnd-bt.start); for(const c of b._cap) if(q>=c.st) ct=c.c;}
  if(cap._t!==ct){cap._t=ct; cap.innerHTML=ct?`<span>${esc(ct)}</span>`:''}
}
Promise.all(['500','700'].map(w=>document.fonts.load(w+' 40px Poppins','Aaक')).concat([document.fonts.load("700 40px Kalam",'Aaक')])).catch(()=>{}).then(()=>document.fonts.ready).then(()=>{build(); renderAt(0); window.__ready=true});
