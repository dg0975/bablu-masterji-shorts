<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/*FONTS*/
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,'Noto Sans Devanagari',sans-serif}
#frame{position:relative;width:1080px;height:1920px;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0}
#hook{position:absolute;left:50px;right:50px;top:300px;z-index:6;text-align:center;font-weight:800;font-size:86px;line-height:1.08;color:#fff;
 -webkit-text-stroke:10px #1e1620;paint-order:stroke fill;text-shadow:0 10px 0 #1e1620,0 0 30px rgba(0,0,0,.5);transform-origin:50% 50%}
#hook b{color:#ffd54a}
#title{position:absolute;left:40px;top:150px;display:flex;flex-direction:column;gap:6px;z-index:5}
#title .series{align-self:flex-start;background:#ffd54a;color:#1e1620;font-weight:700;font-size:30px;letter-spacing:.06em;padding:8px 22px;border-radius:30px;border:4px solid #1e1620}
#title .ep{color:#fff;font-weight:700;font-size:40px;text-shadow:0 4px 0 #1e1620,0 0 14px rgba(0,0,0,.6);max-width:1000px}
#sub{position:absolute;left:60px;right:60px;top:1452px;min-height:150px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px}
#sub .who{font-weight:700;font-size:32px;padding:4px 20px;border-radius:24px;border:3px solid #1e1620;color:#1e1620}
#sub .line{background:rgba(14,14,22,.86);color:#fff;font-weight:600;font-size:46px;line-height:1.35;text-align:center;padding:14px 30px;border-radius:26px;max-width:960px}
#card{position:absolute;left:70px;right:70px;top:430px;z-index:7;background:#fffaf0;border:6px solid #1e1620;border-radius:40px;padding:44px 50px;box-shadow:0 18px 0 #1e1620;opacity:0;text-align:center}
#card .k{display:inline-block;background:#2bd67b;color:#0b2416;font-weight:700;font-size:34px;padding:6px 24px;border-radius:26px;margin-bottom:22px}
#card .t{color:#1e1620;font-weight:700;font-size:54px;line-height:1.3}
#card .f{margin-top:26px;color:#7a5a2e;font-weight:700;font-size:36px}
#handle{position:absolute;right:40px;top:160px;color:#fff;font-weight:700;font-size:30px;text-shadow:0 3px 0 #1e1620;z-index:5}
#light{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 44%,rgba(0,0,0,0) 55%,rgba(20,8,0,.34) 100%),linear-gradient(160deg,rgba(255,226,180,.16),rgba(255,226,180,0) 45%)}
#stk{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;z-index:8;pointer-events:none}
#ex{position:absolute;left:98px;top:236px;width:900px;height:440px;overflow:visible;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
</style></head>
<body><div id="frame"><div id="world"><svg id="w" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<svg id="ex" width="900" height="440" viewBox="0 0 900 440"></svg><svg id="stk" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><div id="hook"></div><div id="title"><div class="series"></div><div class="ep"></div></div><div id="handle"></div>
<div id="sub"><div class="who"></div><div class="line"></div></div>
<div id="card"><div class="k"></div><div class="t"></div><div class="f"></div></div><div id="light"></div><div id="flash"></div></div>
<script>
/*DATA*/
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eIO=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const eOut=p=>1-Math.pow(1-clamp(p),3);
const lerp=(a,b,p)=>a+(b-a)*p;
/*MASTERJI*/

/* ================= sets (original backgrounds, 1080x1920 world) ================= */
const INK='#1E1620';
function fan(t){let s=''; for(let k=0;k<3;k++){const a=t*720+k*120; s+=`<g transform="rotate(${a.toFixed(1)} 540 170)"><ellipse cx="540" cy="110" rx="26" ry="70" fill="#8b6b4a" stroke="${INK}" stroke-width="4"/></g>`}
  return `<line x1="540" y1="0" x2="540" y2="150" stroke="${INK}" stroke-width="8"/><g transform="translate(0 0) scale(1 .35) translate(0 315)">${s}</g><circle cx="540" cy="170" r="26" fill="#6b5137" stroke="${INK}" stroke-width="4"/>`}
function clock(x,y,t){const m=t*30, h=t*2.5;return `<circle cx="${x}" cy="${y}" r="46" fill="#fff8e6" stroke="${INK}" stroke-width="6"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y-32}" stroke="${INK}" stroke-width="4" transform="rotate(${m.toFixed(1)} ${x} ${y})"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y-22}" stroke="${INK}" stroke-width="6" transform="rotate(${(h+120).toFixed(1)} ${x} ${y})"/><circle cx="${x}" cy="${y}" r="5" fill="${INK}"/>`}
function floorPlanks(y0,c1,c2){let s=`<rect x="0" y="${y0}" width="1080" height="${1920-y0}" fill="${c1}"/>`;for(let k=0;k<10;k++){const y=y0+20+k*62;s+=`<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="${c2}" stroke-width="3"/>`;for(let j=0;j<4;j++){const x=((k*137+j*290)%1080);s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+62}" stroke="${c2}" stroke-width="3"/>`}}return s}
/* ---- living backgrounds: small moving things in every set ---- */
const r1=n=>(+n).toFixed(1);
const tri=x=>1-Math.abs((((x%2)+2)%2)-1);
function mixC(a,b,p){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);p=clamp(p);
 return '#'+[16,8,0].map(s=>Math.round(((A>>s)&255)*(1-p)+((B>>s)&255)*p).toString(16).padStart(2,'0')).join('')}
function birdsFly(t,period,y0,n){const u=(t%period)/(period*.55);if(u>1)return '';let s='';
 for(let k=0;k<(n||5);k++){const x=lerp(-160,1240,u)-k*44, y=y0+(k%2?1:-1)*Math.ceil(k/2)*24+Math.sin(t*1.5+k)*6, fl=Math.sin(t*12+k*1.3)*11;
  s+=`<path d="M${r1(x-20)} ${r1(y+fl*.3)} Q${r1(x-9)} ${r1(y-fl)} ${r1(x)} ${r1(y)} Q${r1(x+9)} ${r1(y-fl)} ${r1(x+20)} ${r1(y+fl*.3)}" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`}
 return s}
function paperPlane(t){const u=(t%7)/2.4;if(u>1)return '';const x=lerp(-90,1170,u), y=290+Math.sin(u*7)*28-u*40, r=Math.cos(u*7)*12;
 return `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${r1(r)})"><path d="M-46 0 L40 -4 L-30 -22 Z" fill="#fff" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M-46 0 L40 -4 L-24 14 Z" fill="#e3e9f2" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/></g>`}
function globe(x,y,t){let m='';for(let k=0;k<3;k++){const ph=(t*.5+k/3)%1, c=Math.cos(ph*Math.PI);m+=`<ellipse cx="${x}" cy="${y}" rx="${r1(Math.abs(c)*30)}" ry="30" fill="none" stroke="#2a6a8a" stroke-width="2.5" opacity=".6"/>`}
 return `<path d="M${x-24} ${y+56} h48 l-8 -14 h-32 Z" fill="#6b4a2e" stroke="${INK}" stroke-width="3"/><path d="M${x} ${y+42} v-10" stroke="${INK}" stroke-width="5"/><circle cx="${x}" cy="${y}" r="32" fill="#6fc3ff" stroke="${INK}" stroke-width="4"/>
 <clipPath id="gl${x}"><circle cx="${x}" cy="${y}" r="30"/></clipPath><g clip-path="url(#gl${x})">${[0,1,2].map(k=>{const u=((t*.12+k*.37)%1);return `<ellipse cx="${r1(x-70+u*140)}" cy="${y-10+k*11}" rx="${13+k*4}" ry="${8+k*2}" fill="#5cbf5a"/>`}).join('')}</g>${m}
 <path d="M${x-40} ${y-16} A42 42 0 0 0 ${x+30} ${y+34}" stroke="#8a5c38" stroke-width="4" fill="none"/>`}
function sleepyCat(x,y,t){const b=1+Math.sin(t*2.2)*.05, tail=Math.sin(t*1.7)*18;
 return `<g transform="translate(${x} ${y})"><path d="M46 -2 q30 ${r1(-12+tail*.3)} ${r1(40+tail*.2)} ${r1(-36+tail)}" stroke="${INK}" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M46 -2 q30 ${r1(-12+tail*.3)} ${r1(40+tail*.2)} ${r1(-36+tail)}" stroke="#f29b3a" stroke-width="10" fill="none" stroke-linecap="round"/>
 <g transform="translate(0 0) scale(1 ${b.toFixed(3)})"><ellipse cx="0" cy="-16" rx="58" ry="28" fill="#f29b3a" stroke="${INK}" stroke-width="4"/><path d="M-24 -38 q8 -5 16 0 M4 -42 q8 -5 16 0 M30 -36 q7 -4 14 2" stroke="#c46a1c" stroke-width="4" fill="none"/></g>
 <circle cx="-50" cy="-24" r="24" fill="#f29b3a" stroke="${INK}" stroke-width="4"/><path d="M-70 -38 L-66 -60 L-54 -46 Z M-46 -46 L-34 -60 L-30 -40 Z" fill="#f29b3a" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
 <path d="M-63 -25 q5 4 10 0 M-47 -25 q5 4 10 0" stroke="${INK}" stroke-width="3" fill="none"/><circle cx="-50" cy="-17" r="2.6" fill="#d2413a"/>
 ${[0,1].map(k=>{const q=(t*.4+k*.5)%1;return `<text x="${r1(-64+q*34)}" y="${r1(-62-q*64)}" font-family="Poppins" font-weight="700" font-size="${r1(22+q*14)}" fill="#5b5fa8" opacity="${r1((1-q)*.9)}">z</text>`}).join('')}</g>`}
function cooker(x,y,t){const ph=t%6, puff=ph>4.6?(ph-4.6)/1.4:0, jig=ph>4.1?Math.sin(t*60)*3:0;
 let st='';if(puff>0)for(let k=0;k<4;k++){const q=clamp(puff*1.3-k*.12);st+=`<circle cx="${r1(x+Math.sin(k*2)*14)}" cy="${r1(y-112-q*150)}" r="${r1(12+q*30)}" fill="#fff" opacity="${r1(.8*(1-q))}"/>`}
 return `<ellipse cx="${x}" cy="${y}" rx="70" ry="9" fill="#000" opacity=".18"/><path d="M${x-62} ${y} L${x-58} ${y-70} Q${x} ${y-84} ${x+58} ${y-70} L${x+62} ${y} Z" fill="#c9d0d8" stroke="${INK}" stroke-width="4.5"/><path d="M${x-62} ${y-70} Q${x} ${y-92} ${x+62} ${y-70} Q${x} ${y-62} ${x-62} ${y-70} Z" fill="#a9b1bb" stroke="${INK}" stroke-width="4"/>
 <rect x="${x+56}" y="${y-82}" width="70" height="14" rx="7" fill="#2a2a2a"/><rect x="${r1(x-8+jig)}" y="${y-106}" width="16" height="22" rx="4" fill="#2a2a2a"/><path d="M${x-40} ${y-50} v36" stroke="#fff" stroke-width="5" opacity=".5"/>${st}`}
function wireBirds(t){const yAt=x=>{const u=x/680;return (1-u)*(1-u)*360+2*u*(1-u)*400+u*u*372};
 return `<path d="M0 360 Q340 400 680 372" stroke="#333" stroke-width="3" fill="none"/>`+[150,250,520].map((x,k)=>{const y=yAt(x), hp=Math.max(0,Math.sin(t*2.3+k*2.1))**8*14, lk=Math.sin(t*.7+k)>0?1:-1;
  return `<g transform="translate(${x} ${r1(y-hp)}) scale(${lk} 1)"><path d="M-4 0 L-8 8 M4 0 L6 8" stroke="#c46a1c" stroke-width="2.5"/><ellipse cx="0" cy="-12" rx="17" ry="12" fill="#5a5f6b" stroke="${INK}" stroke-width="3"/><path d="M-14 -10 L-28 -2 L-16 -2 Z" fill="#3e424c" stroke="${INK}" stroke-width="2.5"/><circle cx="12" cy="-24" r="9" fill="#5a5f6b" stroke="${INK}" stroke-width="3"/><circle cx="15" cy="-26" r="2" fill="#fff"/><path d="M20 -24 l8 2 l-8 3 Z" fill="#ffb020"/></g>`}).join('')}
function autoRick(t,period,yb){const u=(t%period)/3.2;if(u>1)return '';const x=lerp(1300,-300,u), w=t*-9;
 const wheel=(cx)=>`<g transform="rotate(${r1(w*57)} ${cx} ${yb-24})"><circle cx="${cx}" cy="${yb-24}" r="24" fill="#222" stroke="${INK}" stroke-width="3"/><path d="M${cx-18} ${yb-24} h36 M${cx} ${yb-42} v36" stroke="#888" stroke-width="3"/></g>`;
 return `<g transform="translate(${r1(x)} 0)"><ellipse cx="0" cy="${yb}" rx="130" ry="10" fill="#000" opacity=".2"/>
 <path d="M-110 ${yb-40} L-110 ${yb-150} Q-104 ${yb-196} -40 ${yb-200} L100 ${yb-200} Q120 ${yb-196} 120 ${yb-170} L120 ${yb-40} Z" fill="#1e1e1e" stroke="${INK}" stroke-width="4"/>
 <path d="M-120 ${yb-40} L-112 ${yb-120} Q-96 ${yb-136} -60 ${yb-130} L-40 ${yb-60} L120 ${yb-60} L120 ${yb-40} Z" fill="#ffd54a" stroke="${INK}" stroke-width="4"/><rect x="-40" y="${yb-130}" width="150" height="70" fill="#2e9e5b" stroke="${INK}" stroke-width="4"/>
 <path d="M-104 ${yb-120} L-70 ${yb-170} L-56 ${yb-130} Z" fill="#cfeaff" stroke="${INK}" stroke-width="3"/><circle cx="-116" cy="${yb-76}" r="9" fill="#fff6b0" stroke="${INK}" stroke-width="3"/>${wheel(-80)}${wheel(80)}</g>`}
function scooter(t,period,yb){const u=(t%period)/2.6;if(u>1)return '';const x=lerp(-260,1340,u), w=t*9;
 const wheel=cx=>`<g transform="rotate(${r1(w*57)} ${cx} ${yb-20})"><circle cx="${cx}" cy="${yb-20}" r="20" fill="#222" stroke="${INK}" stroke-width="3"/><path d="M${cx-14} ${yb-20} h28" stroke="#888" stroke-width="3"/></g>`;
 return `<g transform="translate(${r1(x)} 0)"><ellipse cx="0" cy="${yb}" rx="90" ry="8" fill="#000" opacity=".2"/><path d="M-70 ${yb-30} Q-70 ${yb-80} -20 ${yb-84} L30 ${yb-84} L52 ${yb-30} Z" fill="#e8213a" stroke="${INK}" stroke-width="4"/><path d="M40 ${yb-30} L62 ${yb-110} L80 ${yb-112}" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>
 <path d="M-50 ${yb-84} L-50 ${yb-150} Q-30 ${yb-176} 0 ${yb-150} L10 ${yb-84}" fill="#2f6bd8" stroke="${INK}" stroke-width="4"/><circle cx="-22" cy="${yb-182}" r="22" fill="#e8213a" stroke="${INK}" stroke-width="4"/><path d="M-4 ${yb-120} L54 ${yb-110}" stroke="#c98b62" stroke-width="10" stroke-linecap="round"/>${wheel(-46)}${wheel(52)}</g>`}
function fishBowl(x,y,t){const dir=Math.cos(t*.9)>0?1:-1, fx_=x+Math.sin(t*.9)*22, fy=y+12+Math.sin(t*1.7)*5;
 const bub=[0,1,2].map(k=>{const q=(t*.6+k/3)%1;return `<circle cx="${r1(fx_+dir*16+Math.sin(q*9)*3)}" cy="${r1(fy-6-q*42)}" r="${r1(3+q*3)}" fill="none" stroke="#fff" stroke-width="2" opacity="${r1(1-q)}"/>`}).join('');
 return `<rect x="${x-110}" y="${y+48}" width="220" height="16" rx="4" fill="#8a5c38" stroke="${INK}" stroke-width="4"/><clipPath id="fb${x}"><circle cx="${x}" cy="${y}" r="47"/></clipPath>
 <circle cx="${x}" cy="${y}" r="50" fill="#e6f6ff" fill-opacity=".6" stroke="${INK}" stroke-width="4"/><g clip-path="url(#fb${x})"><rect x="${x-60}" y="${y-14}" width="120" height="80" fill="#59b8ea" opacity=".75"/><path d="M${x-40} ${y+44} q20 -14 40 0 q20 -14 40 0" fill="#3f8f4a"/>
 <g transform="translate(${r1(fx_)} ${r1(fy)}) scale(${dir} 1)"><ellipse cx="0" cy="0" rx="16" ry="10" fill="#ff8a2a" stroke="${INK}" stroke-width="2.5"/><path d="M-14 0 L-28 ${r1(-9+Math.sin(t*14)*3)} L-28 ${r1(9+Math.sin(t*14)*3)} Z" fill="#ff8a2a" stroke="${INK}" stroke-width="2.5"/><circle cx="8" cy="-3" r="2.6" fill="${INK}"/></g>${bub}</g>
 <path d="M${x-40} ${y-46} Q${x} ${y-56} ${x+40} ${y-46}" stroke="${INK}" stroke-width="4" fill="none"/><path d="M${x-34} ${y-20} q-6 20 0 34" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/>`}
function straps(t){return [0,1,2,3,4,5].map(k=>{const x=110+k*172, sw=Math.sin(t*2.1+k*.6)*9;return `<g transform="rotate(${r1(sw)} ${x} 340)"><line x1="${x}" y1="340" x2="${x}" y2="392" stroke="#555" stroke-width="5"/><circle cx="${x}" cy="408" r="16" fill="none" stroke="#f0f0f0" stroke-width="6"/><circle cx="${x}" cy="408" r="16" fill="none" stroke="${INK}" stroke-width="2"/></g>`}).join('')}
function butterfly(x,y,t,c){const fl=Math.abs(Math.sin(t*14));return `<g transform="translate(${r1(x)} ${r1(y)})"><g transform="scale(${r1(.25+.75*fl)} 1)"><ellipse cx="-12" cy="-6" rx="13" ry="10" fill="${c}" stroke="${INK}" stroke-width="2.5"/><ellipse cx="12" cy="-6" rx="13" ry="10" fill="${c}" stroke="${INK}" stroke-width="2.5"/><ellipse cx="-9" cy="8" rx="9" ry="7" fill="${c}" stroke="${INK}" stroke-width="2.5"/><ellipse cx="9" cy="8" rx="9" ry="7" fill="${c}" stroke="${INK}" stroke-width="2.5"/></g><rect x="-2.5" y="-12" width="5" height="26" rx="2.5" fill="${INK}"/></g>`}
function tree(x,y,s,t,k){const sw=Math.sin(t*1.2+k)*2.5;return `<g transform="rotate(${r1(sw)} ${x} ${y})"><rect x="${x-14*s}" y="${y-150*s}" width="${28*s}" height="${150*s}" fill="#7a5233" stroke="${INK}" stroke-width="4"/>
 <circle cx="${x}" cy="${y-200*s}" r="${90*s}" fill="#3e8a3c" stroke="${INK}" stroke-width="4"/><circle cx="${x-70*s}" cy="${y-150*s}" r="${60*s}" fill="#4f9a4a" stroke="${INK}" stroke-width="4"/><circle cx="${x+70*s}" cy="${y-160*s}" r="${64*s}" fill="#4f9a4a" stroke="${INK}" stroke-width="4"/><circle cx="${x-24*s}" cy="${y-236*s}" r="${30*s}" fill="#68b25f" opacity=".7"/></g>`}
function clouds(t){return [0,1].map(k=>{const x=((k*560+t*30)%1400)-200;return `<g transform="translate(${x.toFixed(0)} ${260+k*120})"><ellipse cx="0" cy="0" rx="90" ry="34" fill="#fff"/><ellipse cx="60" cy="-14" rx="60" ry="30" fill="#fff"/></g>`}).join('')}
function kite(x,y,t){return `<g transform="translate(${(x+Math.sin(t*.8)*40).toFixed(0)} ${(y+Math.sin(t*1.3)*20).toFixed(0)}) rotate(${(Math.sin(t*1.6)*12).toFixed(1)})"><path d="M0 -50 L40 0 L0 50 L-40 0 Z" fill="#e8213a" stroke="${INK}" stroke-width="4"/><path d="M0 -50 L0 50 M-40 0 L40 0" stroke="${INK}" stroke-width="2"/><path d="M0 50 q-20 80 30 160" stroke="${INK}" stroke-width="2" fill="none"/></g>`}
const SETS_NEW={
 park(t,o){const ang=Math.sin(t*2.2)*24, rad=ang*Math.PI/180, sx=690+Math.sin(rad)*330, sy=760+Math.cos(rad)*330;
  return `<rect width="1080" height="1300" fill="#9edcff"/><circle cx="880" cy="250" r="66" fill="#ffd54a"/>${clouds(t)}${kite(260,420,t)}${birdsFly(t,9,330,4)}
  <ellipse cx="200" cy="1060" rx="520" ry="200" fill="#8fcf7a"/><ellipse cx="880" cy="1080" rx="480" ry="190" fill="#7cc26a"/>
  ${tree(110,1190,1.1,t,0)}${tree(980,1170,.95,t,2)}
  <g stroke="${INK}" stroke-width="7" fill="none"><path d="M520 1240 L560 760 L820 760 L860 1240" stroke="#c0392b" stroke-width="16"/><path d="M520 1240 L560 760 L820 760 L860 1240"/></g>
  <path d="M690 760 L${r1(sx-36)} ${r1(sy)} M690 760 L${r1(sx+36)} ${r1(sy)}" stroke="#555" stroke-width="5"/><g transform="rotate(${r1(-ang)} ${r1(sx)} ${r1(sy)})"><rect x="${r1(sx-50)}" y="${r1(sy-4)}" width="100" height="18" rx="5" fill="#ffd54a" stroke="${INK}" stroke-width="4"/></g>
  <rect x="0" y="1240" width="1080" height="680" fill="#9fd27c"/><path d="M0 1300 Q540 1260 1080 1300 L1080 1920 L0 1920 Z" fill="#d9c49a"/>
  ${[0,1,2,3,4,5,6,7,8].map(k=>`<path d="M${40+k*125} 1262 l8 -20 l6 18 l8 -24 l6 26" stroke="#5aa24a" stroke-width="4" fill="none"/>`).join('')}
  <g fill="#8a5c38" stroke="${INK}" stroke-width="5"><rect x="250" y="1120" width="230" height="26" rx="6"/><rect x="250" y="1080" width="230" height="22" rx="6"/><rect x="266" y="1146" width="16" height="90"/><rect x="448" y="1146" width="16" height="90"/></g>
  ${butterfly(420+Math.sin(t*.9)*120,900+Math.sin(t*1.7)*60,t,'#ff9ac2')}${butterfly(900+Math.cos(t*.7)*90,980+Math.sin(t*1.3)*50,t+.5,'#ffd54a')}`},
 market(t,o){const stall=(x,c1,c2,name,goods,k)=>{const sw=Math.sin(t*1.8+k)*3, gl=.75+.25*Math.sin(t*9+k*2)*(Math.sin(t*1.3+k)>.85?1:.1);
